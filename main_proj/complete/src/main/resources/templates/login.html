<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Đăng nhập</title>
  <style>
      * {
        box-sizing: border-box;
        font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
      }

      body {
        background: linear-gradient(135deg, #c7a384, #8899b5);
        display: flex;
        align-items: center;
        justify-content: center;
        height: 100vh;
        margin: 0;
      }

      .container {
        background-color: #fff;
        width: 380px;
        padding: 30px;
        border-radius: 12px;
        box-shadow: 0 5px 20px rgba(0, 0, 0, 0.2);
        transition: transform 0.3s ease, box-shadow 0.3s ease;
      }

      .container:hover {
        transform: translateY(-5px);
        box-shadow: 0 8px 25px rgba(0, 0, 0, 0.3);
      }

      h2 {
        text-align: center;
        color: #333;
        margin-bottom: 20px;
        font-size: 24px;
      }

      .form-group {
        margin-bottom: 15px;
      }

      label {
        display: block;
        font-weight: 600;
        margin-bottom: 5px;
        color: #333;
      }

      input {
        width: 100%;
        padding: 12px;
        border: 1px solid #ccc;
        border-radius: 6px;
        font-size: 14px;
        transition: border-color 0.3s, box-shadow 0.3s;
      }

      input:focus {
        border-color: #2575fc;
        box-shadow: 0 0 5px rgba(37, 117, 252, 0.5);
        outline: none;
      }

      button {
        width: 100%;
        padding: 12px;
        background-color: #2575fc;
        color: white;
        border: none;
        border-radius: 6px;
        cursor: pointer;
        font-size: 16px;
        font-weight: bold;
        transition: background-color 0.3s, transform 0.2s;
      }

      button:hover {
        background-color: #1b5fd9;
        transform: scale(1.03);
      }

      button:active {
        transform: scale(0.98);
      }

      .links {
        text-align: center;
        margin-top: 15px;
      }

      .links a {
        color: #2575fc;
        text-decoration: none;
        font-size: 14px;
        transition: color 0.3s;
      }

      .links a:hover {
        color: #1b5fd9;
        text-decoration: underline;
      }

      .alert {
        padding: 12px;
        margin-bottom: 15px;
        border-radius: 6px;
        text-align: center;
        font-size: 14px;
        animation: slideDown 0.4s ease;
      }

      @keyframes slideDown {
        from {
          opacity: 0;
          transform: translateY(-10px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }
      
      .alert-danger {
        color: #721c24;
        background-color: #f8d7da;
        border: 1px solid #f5c6cb;
      }
      
      .alert-success {
        color: #155724;
        background-color: #d4edda;
        border: 1px solid #c3e6cb;
      }

      .form-footer {
        margin-top: 20px;
        text-align: center;
        font-size: 12px;
        color: #666;
      }
    </style>
</head>
<body>
<div class="container">
    <!-- FORM ĐĂNG NHẬP -->
    <h2>🔐 Đăng nhập</h2>

    <!-- Hiển thị thông báo lỗi -->
    <div th:if="${param.error}" class="alert alert-danger">
        ❌ <span th:text="${param.message != null ? param.message : 'Tên đăng nhập hoặc mật khẩu không đúng!'}"></span>
    </div>

    <!-- Hiển thị thông báo đăng xuất -->
    <div th:if="${param.logout}" class="alert alert-success">
        ✅ Bạn đã đăng xuất thành công.
    </div>

    <!-- Hiển thị thông báo từ controller -->
    <div th:if="${errorMessage}" class="alert alert-danger" th:text="${errorMessage}"></div>
    <div th:if="${successMessage}" class="alert alert-success" th:text="${successMessage}"></div>

    <form th:action="@{/login-process}" method="post">
        <!-- CSRF token -->
        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />

        <div class="form-group">
            <label for="username">👤 Tên đăng nhập</label>
            <input id="username" 
                   type="text" 
                   name="username" 
                   placeholder="Nhập tên đăng nhập" 
                   autocomplete="username"
                   required 
                   autofocus />
        </div>

        <div class="form-group">
            <label for="password">🔑 Mật khẩu</label>
            <input id="password" 
                   type="password" 
                   name="password" 
                   placeholder="Nhập mật khẩu" 
                   autocomplete="current-password"
                   required />
        </div>

        <div class="form-group">
            <button type="submit">Đăng nhập</button>
        </div>
    </form>

    <div class="form-footer">
        © 2024 Hệ thống tư vấn tuyển sinh
    </div>
</div>

<script>
    // Auto-focus vào ô username khi load trang
    window.onload = function() {
        document.getElementById('username').focus();
    };

    // Enter key navigation
    document.getElementById('username').addEventListener('keypress', function(e) {
        if (e.key === 'Enter') {
            e.preventDefault();
            document.getElementById('password').focus();
        }
    });
</script>
</body>
</html>
