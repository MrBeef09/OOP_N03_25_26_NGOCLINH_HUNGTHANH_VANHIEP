<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Eschool - Best Learning Institutions">
  <title>Chào mừng</title>
  <link href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@300;400;600;700&family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    body {
      background-color: white;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
      font-family: Arial, sans-serif;
    }
    .container {
      text-align: center;
    }
    button {
      padding: 10px 20px;
      font-size: 18px;
      cursor: pointer;
      background-color: #2575fc;
      color: white;
      border: none;
      border-radius: 6px;
    }
    button:hover {
      background-color: #1b5fd9;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>Chào mừng bạn đến với trang web</h1>
    <button onclick="goToIndex()">Xem thêm</button>
  </div>

  <script>
    function goToIndex() {
      // Chuyển sang trang index.html
      window.location.href = "index_old.html";
    }
  </script>
</body>
</html>
