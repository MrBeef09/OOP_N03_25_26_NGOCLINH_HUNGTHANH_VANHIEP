<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Đánh giá các trường đại học</title>
  <link rel="stylesheet" href="danhgiachodaihoc.css">
</head>
<body>
  <div class="container">
  <h1 id="page-title">Danh sách các trường đại học</h1>

  <ul class="university-list" id="university-list">
    <li data-school="Trường Đại học Bách Khoa" onclick="openReviewForm('Trường Đại học Bách Khoa')">
      Đại học Bách Khoa
      <div class="university-info">
        <span class="stars">☆☆☆☆☆</span>
        <span class="review-count">0 bình luận</span>
      </div>
    </li>

    <li data-school="Trường Đại học Kinh tế Quốc dân" onclick="openReviewForm('Trường Đại học Kinh tế Quốc dân')">
      Đại học Kinh tế Quốc dân
      <div class="university-info">
        <span class="stars">☆☆☆☆☆</span>
        <span class="review-count">0 bình luận</span>
      </div>
    </li>

    <li data-school="Trường Đại học Ngoại thương" onclick="openReviewForm('Trường Đại học Ngoại thương')">
      Đại học Ngoại thương
      <div class="university-info">
        <span class="stars">☆☆☆☆☆</span>
        <span class="review-count">0 bình luận</span>
      </div>
    </li>

    <li data-school="Trường Đại học Quốc gia Hà Nội" onclick="openReviewForm('Trường Đại học Quốc gia Hà Nội')">
      Đại học Quốc gia Hà Nội
      <div class="university-info">
        <span class="stars">☆☆☆☆☆</span>
        <span class="review-count">0 bình luận</span>
      </div>
    </li>
  </ul>

  <!-- Khu vực hiển thị chi tiết bình luận -->
  <div id="school-detail" style="display:none;">
    <button onclick="backToList()" style="margin-bottom:10px;">← Quay lại danh sách</button>
    <h2 id="school-detail-name"></h2>
    <div id="school-reviews"></div>
    <div id="add-review">
      <h3>Thêm bình luận mới</h3>
      <div class="stars" id="stars">
        <span data-value="1">&#9733;</span>
        <span data-value="2">&#9733;</span>
        <span data-value="3">&#9733;</span>
        <span data-value="4">&#9733;</span>
        <span data-value="5">&#9733;</span>
      </div>
      <textarea id="comment" placeholder="Nhập bình luận của bạn..."></textarea>
      <button onclick="submitReview()">Gửi đánh giá</button>
    </div>
  </div>
</div>


        
    <!-- Hộp đánh giá -->
    <div id="review-form" class="modal">
      <div class="modal-content">
        <span class="close-btn" onclick="closeReviewForm()">&times;</span>
        <h2 id="school-name"></h2>

        <div class="stars" id="stars">
          <span data-value="1">&#9733;</span>
          <span data-value="2">&#9733;</span>
          <span data-value="3">&#9733;</span>
          <span data-value="4">&#9733;</span>
          <span data-value="5">&#9733;</span>
        </div>

        <textarea id="comment" placeholder="Nhập bình luận của bạn..."></textarea>
        <button onclick="submitReview()">Gửi đánh giá</button>
      </div>
    </div>

    <div id="reviews"></div>
  </div>

  <script src="danhgiachodaihoc.js"></script>
</body>
</html>
