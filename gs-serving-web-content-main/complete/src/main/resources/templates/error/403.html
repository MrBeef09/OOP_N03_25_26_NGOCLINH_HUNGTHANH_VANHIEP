<!DOCTYPE html>

<html xmlns:th="http://www.thymeleaf.org" lang="vi">
<head>
    <meta charset="UTF-8">
    <title>403 - Truy cập bị từ chối</title>
    <link rel="stylesheet" th:href="@{/css/bootstrap.min.css}">
    <style>
        body {
            background-color: #f8f9fa;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        .error-container {
            text-align: center;
            background-color: white;
            padding: 40px;
            border-radius: 16px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);
            max-width: 480px;
        }
        h1 {
            font-size: 96px;
            color: #dc3545;
            margin-bottom: 10px;
        }
        h2 {
            font-size: 24px;
            color: #333;
            margin-bottom: 20px;
        }
        p {
            color: #555;
        }
        .btn-home {
            margin-top: 20px;
            padding: 10px 25px;
            background-color: #0d6efd;
            color: white;
            border: none;
            border-radius: 8px;
            text-decoration: none;
            transition: background-color 0.3s;
        }
        .btn-home:hover {
            background-color: #0b5ed7;
        }
    </style>
</head>
<body>
<div class="error-container">
    <h1>403</h1>
    <h2>Truy cập bị từ chối</h2>
    <p>Bạn không có quyền thực hiện hành động này.<br>
       Vui lòng quay lại trang trước hoặc liên hệ quản trị viên.</p>

```
<a href="/" class="btn-home">Quay lại trang chủ</a>
```

</div>
</body>
</html>
