<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Đăng nhập / Đăng ký</title>
  <style>
      * {
        box-sizing: border-box;
        font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
      }

      body {
        background: linear-gradient(135deg, #c7a384, #8899b5);
        display: flex;
        align-items: center;
        justify-content: center;
        height: 100vh;
        margin: 0;
      }

      .container {
        background-color: #fff;
        width: 380px;
        padding: 30px;
        border-radius: 12px;
        box-shadow: 0 5px 20px rgba(0, 0, 0, 0.2);
        transition: transform 0.3s ease, box-shadow 0.3s ease, border 0.3s ease;
      }

      h2 {
        text-align: center;
        color: #333;
        margin-bottom: 20px;
      }

      .form-group {
        margin-bottom: 15px;
      }

      label {
        display: block;
        font-weight: 600;
        margin-bottom: 5px;
        color: #333;
      }

      input,
      select {
        width: 100%;
        padding: 10px;
        border: 1px solid #ccc;
        border-radius: 6px;
        font-size: 14px;
        transition: border-color 0.3s, box-shadow 0.3s;
      }

      input:focus,
      select:focus {
        border-color: #2575fc;
        box-shadow: 0 0 5px rgba(37, 117, 252, 0.5);
        outline: none;
      }

      select {
        cursor: pointer;
        background-color: #fff;
      }

      select option {
        padding: 10px;
      }

      button {
        width: 100%;
        padding: 10px;
        background-color: #2575fc;
        color: white;
        border: none;
        border-radius: 6px;
        cursor: pointer;
        font-size: 15px;
        font-weight: bold;
        transition: background-color 0.3s, transform 0.2s;
      }

      button:hover {
        background-color: #1b5fd9;
        transform: scale(1.03);
      }

      .links {
        text-align: center;
        margin-top: 15px;
      }

      .links a {
        color: #2575fc;
        text-decoration: none;
        font-size: 14px;
        margin: 0 8px;
        cursor: pointer;
        transition: color 0.3s;
      }

      .links a:hover {
        color: #6a11cb;
        text-decoration: underline;
      }

      .form-box {
        display: none;
      }

      .form-box.active {
        display: block;
        animation: fadeIn 0.4s ease;
      }

      @keyframes fadeIn {
        from {
          opacity: 0;
          transform: translateY(-10px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }
      
      .alert {
        padding: 10px;
        margin-bottom: 15px;
        border-radius: 6px;
        text-align: center;
        font-size: 14px;
      }
      
      .alert-danger {
        color: #721c24;
        background-color: #f8d7da;
        border: 1px solid #f5c6cb;
      }
      
      .alert-success {
        color: #155724;
        background-color: #d4edda;
        border: 1px solid #c3e6cb;
      }

      .role-hint {
        font-size: 12px;
        color: #666;
        margin-top: 5px;
        font-style: italic;
      }
    </style>
</head>
<body>
<div class="container" id="form-container">
    <!-- FORM ĐĂNG NHẬP -->
    <div id="login-form" class="form-box active">
        <h2>Đăng nhập</h2>

        <form th:action="@{/login-process}" method="post">
            <!-- CSRF token -->
            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />

            <div th:if="${param.error}" class="alert alert-danger">
                Tên đăng nhập hoặc mật khẩu không đúng.
            </div>
            <div th:if="${param.logout}" class="alert alert-success">
                Bạn đã đăng xuất thành công.
            </div>

            <div class="form-group">
                <label for="username">Tên đăng nhập</label>
                <input id="username" type="text" name="username" placeholder="Nhập tên đăng nhập" required />
            </div>
            <div class="form-group">
                <label for="password">Mật khẩu</label>
                <input id="password" type="password" name="password" placeholder="Nhập mật khẩu" required />
            </div>
            <div class="form-group">
                <button type="submit">Đăng nhập</button>
            </div>
            <div class="links">
                <a href="#" onclick="showForm('register-form');return false;">Đăng ký</a> |
                <a href="#" onclick="showForm('forgot-form');return false;">Quên mật khẩu</a>
            </div>
        </form>
    </div>

    <!-- FORM ĐĂNG KÝ -->
    <div id="register-form" class="form-box">
      <h2>Đăng ký</h2>
      <form th:action="@{/register}" method="post">
        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
        
        <div class="form-group">
          <label for="r-username">Tên đăng nhập</label>
          <input id="r-username" type="text" name="username" placeholder="Nhập tên đăng nhập" required />
        </div>
        
        <div class="form-group">
          <label for="r-email">Email</label>
          <input id="r-email" type="email" name="email" placeholder="Nhập email của bạn" required />
        </div>
        
        <div class="form-group">
          <label for="r-password">Mật khẩu</label>
          <input id="r-password" type="password" name="password" placeholder="Tạo mật khẩu" required />
        </div>
        
        <div class="form-group">
          <label for="r-confirm-password">Xác nhận mật khẩu</label>
          <input id="r-confirm-password" type="password" name="confirmPassword" placeholder="Nhập lại mật khẩu" required />
        </div>
        
        <!-- DROPDOWN CHỌN VAI TRÒ -->
        <div class="form-group">
          <label for="r-role">Vai trò</label>
          <select id="r-role" name="role" required>
            <option value="">-- Chọn vai trò --</option>
            <option value="HOCSINH">Học sinh</option>
            <option value="ADMIN">Quản trị viên</option>
          </select>
          <div class="role-hint">
            💡 Học sinh: Truy cập các tính năng tìm trường, tư vấn<br>
            💡 Quản trị: Quản lý hệ thống và người dùng
          </div>
        </div>
        
        <div class="form-group">
          <button type="submit">Đăng ký</button>
        </div>
        <div class="links">
          <a href="#" onclick="showForm('login-form');return false;">Quay lại đăng nhập</a>
        </div>
      </form>
    </div>

    <!-- FORM QUÊN MẬT KHẨU -->
    <div id="forgot-form" class="form-box">
      <h2>Quên mật khẩu</h2>
      <form th:action="@{/forgot-password}" method="post">
        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
        <div class="form-group">
          <label for="f-email">Email</label>
          <input id="f-email" type="email" name="email" placeholder="Nhập email của bạn" required />
        </div>
        <div class="form-group">
          <button type="submit">Gửi yêu cầu</button>
        </div>
        <div class="links">
          <a href="#" onclick="showForm('login-form');return false;">Quay lại đăng nhập</a>
        </div>
      </form>
    </div>
</div>

<script>
    function showForm(id) {
        document.querySelectorAll(".form-box").forEach((form) => {
            form.classList.remove("active");
        });
        document.getElementById(id).classList.add("active");
    }
    
    // Validate mật khẩu khớp nhau
    document.querySelector('#register-form form').addEventListener('submit', function(e) {
        const password = document.getElementById('r-password').value;
        const confirmPassword = document.getElementById('r-confirm-password').value;
        
        if (password !== confirmPassword) {
            e.preventDefault();
            alert('Mật khẩu xác nhận không khớp!');
            return false;
        }
    });
</script>
</body>
</html>
